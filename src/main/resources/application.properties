# Si Railway nos da una URL, la usa. Si no, usa el localhost de tu PC.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/sistema_electrico}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:Ayrton02.}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ajuste para evitar errores de zona horaria en la nube
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago