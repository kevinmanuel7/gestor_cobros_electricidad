<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado del Cobro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #007bff; color: white; }
        .card { border-radius: 20px; color: #333; }
        .monto-grande { font-size: 3rem; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow-lg p-4 text-center">
            <h2 class="text-muted">✅ Lectura Guardada</h2>
            <hr>
            <p class="fs-4">Arrendatario: <br><strong th:text="${nombre}"></strong></p>
            <p class="fs-5">Consumo: <span th:text="${consumoKwh}"></span> kWh</p>
            
            <div class="my-4">
                <p class="mb-0">Total a cobrar:</p>
                <div class="monto-grande">$<span th:text="${monto}"></span></div>
            </div>
            
            <a href="/menu" class="btn btn-primary btn-lg w-100 mt-3">Volver al Menú</a>
        </div>
    </div>
</body>
</html>
