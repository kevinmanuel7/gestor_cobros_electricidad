<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial por Casa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2 class="text-center">📊 Historial de Consumo</h2>
        
        <form action="/historial" method="get" class="mb-4 mt-4">
            <select name="idCasa" class="form-select mb-2" onchange="this.form.submit()">
                <option value="">Seleccione una casa para ver su historia...</option>
                <option th:each="c : ${todasLasCasas}" 
                        th:value="${c.id}" 
                        th:selected="${casaSeleccionada != null and c.id == casaSeleccionada.id}"
                        th:text="'Casa ' + ${c.id} + ' - ' + ${c.nombreArrendatario}">
                </option>
            </select>
        </form>

        <div th:if="${lecturas}" class="card shadow">
            <div class="card-body">
                <h4 th:text="'Registros de ' + ${casaSeleccionada.nombreArrendatario}"></h4>
                <div class="table-responsive">
                    <table class="table table-striped mt-3">
                        <thead>
                            <tr>
                                <th>Fecha Registro</th>
                                <th>Lectura Medidor</th>
                                <th>Consumo (kWh)</th>
                                <th>Total CLP</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="l : ${lecturas}">
                                <td th:text="${#temporals.format(l.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${l.lecturaMedidor}"></td>
                                <td th:text="${l.consumoKwh}"></td>
                                <td class="fw-bold text-success" th:text="${'$ ' + #numbers.formatInteger(l.montoTotal, 3, 'POINT')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <a href="/menu" class="btn btn-secondary w-100 mt-3">Volver al Menú</a>
    </div>
</body>
</html>
