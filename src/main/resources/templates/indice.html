<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Medidores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .container { max-width: 500px; }
        .card { border-radius: 15px; border: none; }
        .btn-primary { background-color: #007bff; border: none; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">⚡ Medidores de Luz</h2>

        <div th:if="${error}" class="alert alert-danger mb-4" th:text="${error}"></div>

        <div class="card shadow-lg">
            <div class="card-body p-4">
                <form th:action="@{/calcular}" method="post">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Seleccionar Arrendatario:</label>
                        <select name="idCasa" class="form-select form-select-lg">
                            <option th:each="casa : ${todasLasCasas}" 
                                    th:value="${casa.id}" 
                                    th:text="'Casa ' + ${casa.id} + ' - ' + ${casa.nombreArrendatario}">
                            </option>
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Lectura Actual del Medidor:</label>
                        <input type="number" 
                               step="0.1" 
                               name="lecturaActual" 
                               inputmode="decimal" 
                               class="form-control form-control-lg" 
                               placeholder="Ej: 1566.5" 
                               required>
                        <small class="text-muted">El sistema restará automáticamente la lectura anterior.</small>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100">Calcular y Guardar</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
